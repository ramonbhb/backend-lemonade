services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://lemonade:lemonade@postgres:5432/lemonade
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: lake
      SPARK_MODE: local
      AUTH_DEV_MODE: "true"
      MARQUEZ_URL: http://marquez:5000
      MODEL_YAML_PATH: /app/model.yaml
    volumes:
      - ./model.yaml:/app/model.yaml:ro
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build: .
    command: python -m lemonade_backend.jobs.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://lemonade:lemonade@postgres:5432/lemonade
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: lake
      SPARK_MODE: local
      MODEL_YAML_PATH: /app/model.yaml
    volumes:
      - ./model.yaml:/app/model.yaml:ro
      - ./src:/app/src:ro
    depends_on:
      - redis
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lemonade
      POSTGRES_PASSWORD: lemonade
      POSTGRES_DB: lemonade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemonade"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  marquez:
    image: marquezproject/marquez:latest
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: lemonade
      POSTGRES_PASSWORD: lemonade
      POSTGRES_DB: marquez
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
