apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: lemonade-spark-template
  namespace: lemonade
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: lemonade-backend:latest
  mainApplicationFile: local:///app/src/lemonade_backend/jobs/worker.py
  sparkVersion: "3.5.0"
  restartPolicy:
    type: Never
  driver:
    cores: 2
    memory: "4g"
    serviceAccount: spark
    labels:
      version: 3.5.0
  executor:
    cores: 4
    instances: 4
    memory: "8g"
    labels:
      version: 3.5.0
  dynamicAllocation:
    enabled: true
    initialExecutors: 2
    minExecutors: 2
    maxExecutors: 20
