apiVersion: apps/v1
kind: Deployment
metadata:
  name: lemonade-api
  namespace: lemonade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lemonade-api
  template:
    metadata:
      labels:
        app: lemonade-api
    spec:
      containers:
        - name: api
          image: lemonade-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lemonade-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SPARK_MODE
              value: k8s
            - name: AUTH_DEV_MODE
              value: "false"
            - name: KEYCLOAK_URL
              value: http://keycloak.lemonade.svc:8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: lemonade-api
  namespace: lemonade
spec:
  selector:
    app: lemonade-api
  ports:
    - port: 8000
      targetPort: 8000
